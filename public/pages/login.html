
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arcanum — Вход</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <main class="auth-page">
        <section class="auth-card">

            <div class="auth-logo">ARCANUM</div>

            <h1>Вход в аккаунт</h1>
            <p>Продолжи своё приключение</p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Введите пароль"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div id="errorMessage" class="auth-error" hidden></div>
                <div id="successMessage" class="auth-success" hidden></div>

                <button type="submit" id="loginButton">
                    Войти в аккаунт
                </button>

            </form>

            <div class="auth-footer">
                Нет аккаунта?
                <a href="register.html">Создать аккаунт</a>
            </div>

            <div class="auth-footer">
                <a href="../index.html">Вернуться на главную</a>
            </div>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>

    <script>
        const supabaseClient = window.supabase.createClient(
            CONFIG.SUPABASE_URL,
            CONFIG.SUPABASE_ANON_KEY
        );

        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const errorMessage = document.getElementById("errorMessage");
        const successMessage = document.getElementById("successMessage");

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.hidden = false;
            successMessage.hidden = true;
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.hidden = false;
            errorMessage.hidden = true;
        }

        loginForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            errorMessage.hidden = true;
            successMessage.hidden = true;

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            loginButton.disabled = true;
            loginButton.textContent = "Выполняется вход...";

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    throw error;
                }

                if (!data.session) {
                    throw new Error("Не удалось создать сессию. Попробуй войти ещё раз.");
                }

                showSuccess("Вход выполнен! Перенаправляем...");

                window.location.href = "dashboard.html";

            } catch (error) {
                console.error("Ошибка входа:", error);

                let message = error.message;

                if (message.includes("Invalid login credentials")) {
                    message = "Неверный email или пароль.";
                } else if (message.includes("Email not confirmed")) {
                    message = "Подтверди email через письмо, отправленное при регистрации.";
                } else if (message.includes("fetch")) {
                    message = "Не удалось подключиться к серверу. Проверь интернет.";
                }

                showError(message);

                loginButton.disabled = false;
                loginButton.textContent = "Войти в аккаунт";
            }
        });
    </script>

</body>
</html>
