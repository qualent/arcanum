<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arcanum — Создание персонажа</title>

    <link rel="stylesheet" href="../css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
</head>

<body>

<header class="site-header">
    <div class="container header-inner">
        <a href="dashboard.html" class="logo">ARCANUM</a>

        <a href="dashboard.html" class="nav-link">
            ← Назад
        </a>
    </div>
</header>

<main class="container">

    <section class="page-header">
        <span class="eyebrow">НОВАЯ КАМПАНИЯ</span>
        <h1>Создание персонажа</h1>
        <p>
            Создай героя, которым будешь проходить свою историю.
        </p>
    </section>

    <form id="characterForm" class="form-card">

        <div class="form-section">
            <h2>Основное</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label for="characterName">
                        Имя персонажа
                    </label>

                    <input
                        type="text"
                        id="characterName"
                        placeholder="Например: Каэль"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="race">
                        Раса
                    </label>

                    <select id="race">
                        <option value="Человек">Человек</option>
                        <option value="Эльф">Эльф</option>
                        <option value="Полуэльф">Полуэльф</option>
                        <option value="Дварф">Дварф</option>
                        <option value="Полурослик">Полурослик</option>
                        <option value="Тифлинг">Тифлинг</option>
                        <option value="Драконорождённый">Драконорождённый</option>
                        <option value="Полуорк">Полуорк</option>
                        <option value="custom">Своя раса</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="characterClass">
                        Класс
                    </label>

                    <select id="characterClass">
                        <option value="Воин">Воин</option>
                        <option value="Варвар">Варвар</option>
                        <option value="Плут">Плут</option>
                        <option value="Следопыт">Следопыт</option>
                        <option value="Паладин">Паладин</option>
                        <option value="Жрец">Жрец</option>
                        <option value="Волшебник">Волшебник</option>
                        <option value="Чародей">Чародей</option>
                        <option value="Колдун">Колдун</option>
                        <option value="Друид">Друид</option>
                        <option value="Монах">Монах</option>
                        <option value="Бард">Бард</option>
                        <option value="custom">Свой класс</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="level">
                        Уровень
                    </label>

                    <select id="level">
                        <option value="1">1</option>
                        <option value="3">3</option>
                        <option value="5">5</option>
                        <option value="10">10</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="background">
                        Предыстория
                    </label>

                    <select id="background">
                        <option value="Авантюрист">Авантюрист</option>
                        <option value="Солдат">Солдат</option>
                        <option value="Преступник">Преступник</option>
                        <option value="Учёный">Учёный</option>
                        <option value="Дворянин">Дворянин</option>
                        <option value="Изгнанник">Изгнанник</option>
                        <option value="Странник">Странник</option>
                        <option value="custom">Своя предыстория</option>
                    </select>
                </div>

            </div>

            <div id="customFields" class="form-grid" style="display: none;">

                <div class="form-group">
                    <label for="customRace">
                        Своя раса
                    </label>

                    <input
                        type="text"
                        id="customRace"
                        placeholder="Введите расу"
                    >
                </div>

                <div class="form-group">
                    <label for="customClass">
                        Свой класс
                    </label>

                    <input
                        type="text"
                        id="customClass"
                        placeholder="Введите класс"
                    >
                </div>

                <div class="form-group">
                    <label for="customBackground">
                        Своя предыстория
                    </label>

                    <input
                        type="text"
                        id="customBackground"
                        placeholder="Введите предысторию"
                    >
                </div>

            </div>
        </div>


        <div class="form-section">

            <h2>Характеристики</h2>

            <div class="stats-grid">

                <div class="stat-card">
                    <span>СИЛ</span>

                    <input
                        type="number"
                        id="strength"
                        value="10"
                        min="1"
                        max="30"
                    >

                    <strong id="strengthMod">+0</strong>
                </div>

                <div class="stat-card">
                    <span>ЛОВ</span>

                    <input
                        type="number"
                        id="dexterity"
                        value="10"
                        min="1"
                        max="30"
                    >

                    <strong id="dexterityMod">+0</strong>
                </div>

                <div class="stat-card">
                    <span>ТЕЛ</span>

                    <input
                        type="number"
                        id="constitution"
                        value="10"
                        min="1"
                        max="30"
                    >

                    <strong id="constitutionMod">+0</strong>
                </div>

                <div class="stat-card">
                    <span>ИНТ</span>

                    <input
                        type="number"
                        id="intelligence"
                        value="10"
                        min="1"
                        max="30"
                    >

                    <strong id="intelligenceMod">+0</strong>
                </div>

                <div class="stat-card">
                    <span>МДР</span>

                    <input
                        type="number"
                        id="wisdom"
                        value="10"
                        min="1"
                        max="30"
                    >

                    <strong id="wisdomMod">+0</strong>
                </div>

                <div class="stat-card">
                    <span>ХАР</span>

                    <input
                        type="number"
                        id="charisma"
                        value="10"
                        min="1"
                        max="30"
                    >

                    <strong id="charismaMod">+0</strong>
                </div>

            </div>

        </div>


        <div class="form-section">

            <h2>Мировоззрение</h2>

            <div class="form-group">

                <select id="alignment">

                    <option value="Законопослушный добрый">
                        Законопослушный добрый
                    </option>

                    <option value="Нейтральный добрый">
                        Нейтральный добрый
                    </option>

                    <option value="Хаотичный добрый">
                        Хаотичный добрый
                    </option>

                    <option value="Законопослушный нейтральный">
                        Законопослушный нейтральный
                    </option>

                    <option value="Истинно нейтральный">
                        Истинно нейтральный
                    </option>

                    <option value="Хаотичный нейтральный">
                        Хаотичный нейтральный
                    </option>

                    <option value="Законопослушный злой">
                        Законопослушный злой
                    </option>

                    <option value="Нейтральный злой">
                        Нейтральный злой
                    </option>

                    <option value="Хаотичный злой">
                        Хаотичный злой
                    </option>

                </select>

            </div>

        </div>


        <div class="form-section">

            <h2>Описание персонажа</h2>

            <div class="form-grid">

                <div class="form-group full-width">

                    <label for="history">
                        История
                    </label>

                    <textarea
                        id="history"
                        rows="5"
                        placeholder="Кем был персонаж до начала приключения?"
                    ></textarea>

                </div>

                <div class="form-group">

                    <label for="personality">
                        Характер
                    </label>

                    <textarea
                        id="personality"
                        rows="4"
                        placeholder="Каким он является?"
                    ></textarea>

                </div>

                <div class="form-group">

                    <label for="appearance">
                        Внешность
                    </label>

                    <textarea
                        id="appearance"
                        rows="4"
                        placeholder="Как выглядит персонаж?"
                    ></textarea>

                </div>

                <div class="form-group full-width">

                    <label for="goals">
                        Цели
                    </label>

                    <textarea
                        id="goals"
                        rows="4"
                        placeholder="Чего персонаж хочет добиться?"
                    ></textarea>

                </div>

                <div class="form-group full-width">

                    <label for="preferences">
                        Дополнительные пожелания
                    </label>

                    <textarea
                        id="preferences"
                        rows="4"
                        placeholder="Особенности персонажа, желаемый стиль игры, важные детали..."
                    ></textarea>

                </div>

            </div>

        </div>


        <div id="characterError" class="form-message error"></div>

        <div id="characterSuccess" class="form-message success"></div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
                id="createCharacterButton"
            >
                Создать персонажа
            </button>

        </div>

    </form>

</main>


<script>

const supabaseClient = supabase.createClient(
    CONFIG.SUPABASE_URL,
    CONFIG.SUPABASE_ANON_KEY
);

const form = document.getElementById("characterForm");

const errorMessage = document.getElementById("characterError");
const successMessage = document.getElementById("characterSuccess");

const createButton = document.getElementById("createCharacterButton");

const campaignId = localStorage.getItem("arcanum_campaign_id");

let currentUser = null;


async function checkUserAndCampaign() {

    const {
        data: {
            user
        },
        error: userError
    } = await supabaseClient.auth.getUser();

    if (userError || !user) {
        window.location.href = "login.html";
        return;
    }

    currentUser = user;

    if (!campaignId) {

        errorMessage.textContent =
            "Кампания не найдена. Сначала создай кампанию.";

        createButton.disabled = true;

        return;
    }


    const {
        data: campaign,
        error: campaignError
    } = await supabaseClient
        .from("campaigns")
        .select("id, name")
        .eq("id", campaignId)
        .maybeSingle();


    if (campaignError) {

        console.error(campaignError);

        errorMessage.textContent =
            "Не удалось загрузить кампанию.";

        createButton.disabled = true;

        return;
    }


    if (!campaign) {

        errorMessage.textContent =
            "Кампания не найдена или у тебя нет к ней доступа.";

        createButton.disabled = true;

        return;
    }
}


function calculateModifier(value) {

    return Math.floor((Number(value) - 10) / 2);

}


function modifierText(value) {

    const modifier = calculateModifier(value);

    if (modifier >= 0) {
        return "+" + modifier;
    }

    return modifier.toString();

}


function updateModifiers() {

    document.getElementById("strengthMod").textContent =
        modifierText(document.getElementById("strength").value);

    document.getElementById("dexterityMod").textContent =
        modifierText(document.getElementById("dexterity").value);

    document.getElementById("constitutionMod").textContent =
        modifierText(document.getElementById("constitution").value);

    document.getElementById("intelligenceMod").textContent =
        modifierText(document.getElementById("intelligence").value);

    document.getElementById("wisdomMod").textContent =
        modifierText(document.getElementById("wisdom").value);

    document.getElementById("charismaMod").textContent =
        modifierText(document.getElementById("charisma").value);
}


document.querySelectorAll(".stat-card input").forEach(input => {

    input.addEventListener("input", updateModifiers);

});


const raceSelect = document.getElementById("race");
const classSelect = document.getElementById("characterClass");
const backgroundSelect = document.getElementById("background");

const customFields = document.getElementById("customFields");


function updateCustomFields() {

    const showCustom =
        raceSelect.value === "custom" ||
        classSelect.value === "custom" ||
        backgroundSelect.value === "custom";

    customFields.style.display =
        showCustom ? "grid" : "none";
}


raceSelect.addEventListener("change", updateCustomFields);
classSelect.addEventListener("change", updateCustomFields);
backgroundSelect.addEventListener("change", updateCustomFields);


form.addEventListener("submit", async (event) => {

    event.preventDefault();

    errorMessage.textContent = "";
    successMessage.textContent = "";

    createButton.disabled = true;
    createButton.textContent = "Создаём...";


    let race = raceSelect.value;

    let characterClass = classSelect.value;

    let background = backgroundSelect.value;


    if (race === "custom") {

        race =
            document.getElementById("customRace").value.trim();

        if (!race) {
            errorMessage.textContent =
                "Укажи свою расу.";

            createButton.disabled = false;
            createButton.textContent = "Создать персонажа";

            return;
        }
    }


    if (characterClass === "custom") {

        characterClass =
            document.getElementById("customClass").value.trim();

        if (!characterClass) {
            errorMessage.textContent =
                "Укажи свой класс.";

            createButton.disabled = false;
            createButton.textContent = "Создать персонажа";

            return;
        }
    }


    if (background === "custom") {

        background =
            document.getElementById("customBackground").value.trim();

        if (!background) {
            errorMessage.textContent =
                "Укажи свою предысторию.";

            createButton.disabled = false;
            createButton.textContent = "Создать персонажа";

            return;
        }
    }


    const character = {

        user_id: currentUser.id,

        campaign_id: campaignId,

        name:
            document.getElementById("characterName").value.trim(),

        race: race,

        class:
            characterClass,

        level:
            Number(document.getElementById("level").value),

        background:
            background,

        strength:
            Number(document.getElementById("strength").value),

        dexterity:
            Number(document.getElementById("dexterity").value),

        constitution:
            Number(document.getElementById("constitution").value),

        intelligence:
            Number(document.getElementById("intelligence").value),

        wisdom:
            Number(document.getElementById("wisdom").value),

        charisma:
            Number(document.getElementById("charisma").value),

        alignment:
            document.getElementById("alignment").value,

        history:
            document.getElementById("history").value.trim(),

        personality:
            document.getElementById("personality").value.trim(),

        appearance:
            document.getElementById("appearance").value.trim(),

        goals:
            document.getElementById("goals").value.trim(),

        preferences:
            document.getElementById("preferences").value.trim()

    };


    if (!character.name) {

        errorMessage.textContent =
            "Введи имя персонажа.";

        createButton.disabled = false;
        createButton.textContent = "Создать персонажа";

        return;
    }


    const {
        data,
        error
    } = await supabaseClient
        .from("characters")
        .insert(character)
        .select()
        .single();


    if (error) {

        console.error(error);

        errorMessage.textContent =
            "Не удалось создать персонажа: " + error.message;

        createButton.disabled = false;
        createButton.textContent = "Создать персонажа";

        return;
    }


    localStorage.setItem(
        "arcanum_character_id",
        data.id
    );

    localStorage.removeItem(
        "arcanum_character"
    );


    successMessage.textContent =
        "Персонаж создан. Переходим к игре...";


    setTimeout(() => {

        window.location.href = "game.html";

    }, 500);

});


checkUserAndCampaign();

updateModifiers();

</script>

</body>
</html>
