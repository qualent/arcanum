
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arcanum — Регистрация</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <main class="auth-page">
        <section class="auth-card">

            <div class="auth-logo">ARCANUM</div>

            <h1>Создание аккаунта</h1>
            <p>Начни собственную историю</p>

            <form id="registerForm">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Минимум 6 символов"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Повтори пароль</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Повтори пароль"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                </div>

                <div id="errorMessage" class="auth-error" hidden></div>
                <div id="successMessage" class="auth-success" hidden></div>

                <button type="submit" id="registerButton">
                    Создать аккаунт
                </button>

            </form>

            <div class="auth-footer">
                Уже есть аккаунт?
                <a href="login.html">Войти</a>
            </div>

            <div class="auth-footer">
                <a href="../index.html">Вернуться на главную</a>
            </div>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>

    <script>
        const supabaseClient = window.supabase.createClient(
            CONFIG.SUPABASE_URL,
            CONFIG.SUPABASE_ANON_KEY
        );

        const registerForm = document.getElementById("registerForm");
        const registerButton = document.getElementById("registerButton");
        const errorMessage = document.getElementById("errorMessage");
        const successMessage = document.getElementById("successMessage");

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.hidden = false;
            successMessage.hidden = true;
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.hidden = false;
            errorMessage.hidden = true;
        }

        registerForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            errorMessage.hidden = true;
            successMessage.hidden = true;

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password.length < 6) {
                showError("Пароль должен содержать минимум 6 символов.");
                return;
            }

            if (password !== confirmPassword) {
                showError("Пароли не совпадают.");
                return;
            }

            registerButton.disabled = true;
            registerButton.textContent = "Создаём аккаунт...";

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        emailRedirectTo: window.location.origin + "/pages/dashboard.html"
                    }
                });

                if (error) {
                    throw error;
                }

                if (data.session) {
                    showSuccess("Аккаунт создан! Перенаправляем...");

                    window.location.href = "dashboard.html";
                    return;
                }

                showSuccess(
                    "Аккаунт создан! Проверь почту и перейди по ссылке из письма для подтверждения email."
                );

                registerForm.reset();

            } catch (error) {
                console.error("Ошибка регистрации:", error);

                let message = error.message;

                if (message.includes("User already registered")) {
                    message = "Аккаунт с таким email уже существует.";
                } else if (message.includes("Password should be")) {
                    message = "Пароль слишком простой. Попробуй другой.";
                } else if (message.includes("Unable to validate email")) {
                    message = "Проверь правильность введённого email.";
                } else if (message.includes("fetch")) {
                    message = "Не удалось подключиться к серверу. Проверь интернет.";
                }

                showError(message);

            } finally {
                registerButton.disabled = false;
                registerButton.textContent = "Создать аккаунт";
            }
        });
    </script>

</body>
</html>
