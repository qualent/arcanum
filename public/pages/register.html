<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arcanum — Регистрация</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            ARCANUM
        </div>

        <div class="auth-subtitle">
            Создание аккаунта
        </div>


        <form id="registerForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Пароль
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Минимум 6 символов"
                    minlength="6"
                    required
                >

            </div>


            <div class="form-group">

                <label for="passwordConfirm">
                    Повторите пароль
                </label>

                <input
                    type="password"
                    id="passwordConfirm"
                    placeholder="Повторите пароль"
                    minlength="6"
                    required
                >

            </div>


            <div
                id="errorMessage"
                style="
                    display: none;
                    color: #d86b6b;
                    font-size: 13px;
                    margin-bottom: 15px;
                    line-height: 1.5;
                "
            ></div>


            <div
                id="successMessage"
                style="
                    display: none;
                    color: #8fcf9b;
                    font-size: 13px;
                    margin-bottom: 15px;
                    line-height: 1.5;
                "
            ></div>


            <button
                type="submit"
                class="button button-primary auth-button"
                id="registerButton"
            >
                Создать аккаунт
                <span>→</span>
            </button>

        </form>


        <div class="auth-footer">

            Уже есть аккаунт?

            <a href="login.html">
                Войти
            </a>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>


<script>

    const supabaseClient = window.supabase.createClient(
        CONFIG.SUPABASE_URL,
        CONFIG.SUPABASE_ANON_KEY
    );


    const form =
        document.getElementById("registerForm");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const passwordConfirmInput =
        document.getElementById("passwordConfirm");

    const errorMessage =
        document.getElementById("errorMessage");

    const successMessage =
        document.getElementById("successMessage");

    const registerButton =
        document.getElementById("registerButton");


    function showError(message) {

        errorMessage.textContent = message;
        errorMessage.style.display = "block";

        successMessage.style.display = "none";
    }


    function showSuccess(message) {

        successMessage.textContent = message;
        successMessage.style.display = "block";

        errorMessage.style.display = "none";
    }


    form.addEventListener("submit", async function(event) {

        event.preventDefault();


        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        const passwordConfirm =
            passwordConfirmInput.value;


        errorMessage.style.display = "none";
        successMessage.style.display = "none";


        if (password !== passwordConfirm) {

            showError("Пароли не совпадают.");

            return;
        }


        if (password.length < 6) {

            showError("Пароль должен содержать минимум 6 символов.");

            return;
        }


        registerButton.disabled = true;

        registerButton.innerHTML =
            "Создание аккаунта...";


        try {

            const { data, error } =
                await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });


            if (error) {
                throw error;
            }


            /*
             * Если подтверждение email отключено,
             * Supabase сразу создаст сессию.
             */

            if (data.session) {

                showSuccess(
                    "Аккаунт создан. Перенаправляем..."
                );


                setTimeout(() => {

                    window.location.href =
                        "dashboard.html";

                }, 700);


                return;
            }


            /*
             * Если включено подтверждение email,
             * сессии пока не будет.
             */

            showSuccess(
                "Аккаунт создан. Проверьте почту и подтвердите email. После этого войдите в Arcanum."
            );


            registerButton.disabled = false;

            registerButton.innerHTML =
                "Создать аккаунт <span>→</span>";

        }
        catch (error) {

            console.error(error);


            let message =
                "Не удалось создать аккаунт.";


            if (
                error.message &&
                error.message.toLowerCase().includes("already registered")
            ) {

                message =
                    "Этот email уже зарегистрирован.";

            }
            else if (
                error.message &&
                error.message.toLowerCase().includes("invalid")
            ) {

                message =
                    "Проверьте правильность email.";

            }
            else if (error.message) {

                message =
                    error.message;
            }


            showError(message);


            registerButton.disabled = false;

            registerButton.innerHTML =
                "Создать аккаунт <span>→</span>";

        }

    });

</script>

</body>
</html>
